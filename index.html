<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オーダー呼出システム</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .column {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .column h2 {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 3px solid #eee;
      margin-top: 0;
    }
    .preparing-title { color: #e67e22; border-bottom-color: #e67e22 !important; }
    .ready-title { color: #27ae60; border-bottom-color: #27ae60 !important; }
    
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .receipt-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .items-list {
      font-size: 1.3rem;
      font-weight: bold;
      color: #222;
      margin-bottom: 15px;
      text-align: left;
      background: #fff;
      padding: 12px;
      border-radius: 4px;
      border: 1px dashed #ccc;
      min-height: 40px;
      line-height: 1.5;
    }
    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
      color: #fff;
      width: 100%;
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    
    .btn-ready { background-color: #e67e22; }
    .btn-done { background-color: #27ae60; }
  </style>
</head>
<body>

  <h1>オーダー状況</h1>
  
  <div class="container">
    <div class="column">
      <h2 class="preparing-title">調理中</h2>
      <div id="preparing-container" class="orders-grid"></div>
    </div>
    <div class="column">
      <h2 class="ready-title">呼出中 (お受取口へ)</h2>
      <div id="ready-container" class="orders-grid"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ★ここを最新のGASウェブアプリURLに書き換えてください★
    // ==========================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwiPE1wSVaTV767nz1r31h3qNUiJWKwn8e53VtK5UH3lIuxm2FH30LyW4sObaFT4oQ0OQ/exec';

    let isInitialLoad = true; 
    let lockedOrders = new Set(); // ★追加：操作直後のチラつき防止用ロック
    let audioQueue = [];          // ★追加：音声の順番待ちリスト
    let isPlayingAudio = false;   // ★追加：今、誰かが喋っているかどうかの判定

    function fetchOrders() {
      const script = document.createElement('script');
      script.src = `${GAS_URL}?callback=renderOrders&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    function updateStatus(receiptNumber, newStatus, btnElement) {
      // ★チラつき防止：押した直後から8秒間は、このレシート番号に関するGASからの古いデータを無視する
      lockedOrders.add(receiptNumber);
      setTimeout(() => lockedOrders.delete(receiptNumber), 8000);

      const card = btnElement.closest('.card');
      
      if (newStatus === '呼出中') {
        document.getElementById('ready-container').appendChild(card);
        btnElement.className = 'btn btn-done';
        btnElement.innerText = '受渡';
        btnElement.onclick = () => updateStatus(receiptNumber, '受渡完了', btnElement);
        
        // ★変更：音声を直接再生せず、一旦「順番待ちリスト」に並ばせる
        enqueueVoice(receiptNumber);
      } else if (newStatus === '受渡完了') {
        card.remove(); 
      }

      const url = `${GAS_URL}?action=update_status&receiptNumber=${encodeURIComponent(receiptNumber)}&status=${encodeURIComponent(newStatus)}&callback=updateCallback`;
      const script = document.createElement('script');
      script.src = url;
      document.body.appendChild(script);
    }

    function updateCallback(response) {}

    function renderOrders(orders) {
      const preparingContainer = document.getElementById('preparing-container');
      const readyContainer = document.getElementById('ready-container');
      
      let hasNewOrder = false;
      const serverReceipts = orders.map(o => o.receiptNumber);

      // 1. すでに画面にあるカードの処理
      document.querySelectorAll('.card').forEach(card => {
        const rec = card.dataset.receipt;
        
        // ★さっき自分がボタンを押したばかりのカードなら、GASの遅延を無視してスルー
        if (lockedOrders.has(rec)) return;

        if (!serverReceipts.includes(rec)) {
          // サーバーから消えていたら画面からも消す
          card.remove();
        } else {
          // サーバーと画面で状態が違う場合（別のタブレットで操作された場合など）は移動させる
          const serverOrder = orders.find(o => o.receiptNumber === rec);
          if (serverOrder.status === '呼出中' && card.parentElement === preparingContainer) {
            readyContainer.appendChild(card);
            const btn = card.querySelector('button');
            btn.className = 'btn btn-done';
            btn.innerText = '受渡';
            btn.onclick = () => updateStatus(rec, '受渡完了', btn);
          }
        }
      });

      // 2. 新しいカードの追加処理
      orders.forEach(order => {
        if (lockedOrders.has(order.receiptNumber)) return;
        
        const exists = document.querySelector(`.card[data-receipt="${order.receiptNumber}"]`);
        if (!exists) {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.receipt = order.receiptNumber;
          
          const itemsHtml = order.items ? order.items.replace(/\n/g, '<br>') : '商品情報なし';

          card.innerHTML = `
            <div class="receipt-number">${order.receiptNumber}</div>
            <div class="items-list">${itemsHtml}</div>
          `;

          if (order.status === '調理中') {
            const btn = document.createElement('button');
            btn.className = 'btn btn-ready';
            btn.innerText = '準備完了';
            btn.onclick = () => updateStatus(order.receiptNumber, '呼出中', btn);
            card.appendChild(btn);
            preparingContainer.appendChild(card);
            
            hasNewOrder = true;
          } else if (order.status === '呼出中') {
            const btn = document.createElement('button');
            btn.className = 'btn btn-done';
            btn.innerText = '受渡';
            btn.onclick = () => updateStatus(order.receiptNumber, '受渡完了', btn);
            card.appendChild(btn);
            readyContainer.appendChild(card);
          }
        }
      });

      if (!isInitialLoad && hasNewOrder) {
        const notifyAudio = new Audio('./audio/notify.mp3');
        notifyAudio.play().catch(e => console.error("通知音再生エラー", e));
      }
      
      isInitialLoad = false; 
    }

    // ==========================================
    // ★追加：音声をキューに入れて順番に再生する仕組み
    // ==========================================
    function enqueueVoice(receiptNumber) {
      audioQueue.push(receiptNumber); // リストの末尾に番号を追加
      if (!isPlayingAudio) {
        processAudioQueue(); // 今誰も喋っていなければ、すぐ再生スタート
      }
    }

    async function processAudioQueue() {
      // 順番待ちが0件になったら終了
      if (audioQueue.length === 0) {
        isPlayingAudio = false;
        return;
      }
      
      isPlayingAudio = true;
      const receiptNumber = audioQueue.shift(); // 順番待ちの先頭を取り出す
      
      await playCustomVoice(receiptNumber); // その番号の音声を再生
      
      // 次の音声が被らないよう、1秒（1000ms）間隔をあけてから次の人の音声を再生
      setTimeout(processAudioQueue, 1000);
    }

    async function playCustomVoice(receiptNumber) {
      const playAudio = (fileName) => {
        return new Promise((resolve) => {
          const audio = new Audio('./audio/' + fileName);
          audio.onended = resolve;
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      };

      try {
        await playAudio('prefix.mp3');
        for (let i = 0; i < receiptNumber.length; i++) {
          const char = receiptNumber[i];
          if (/[0-9]/.test(char)) {
            await playAudio(char + '.mp3');
          } else if (char === '-') {
            await playAudio('hyphen.mp3');
          }
        }
        await playAudio('suffix.mp3');
      } catch (e) {
        console.error("音声再生エラー", e);
      }
    }

    setInterval(fetchOrders, 800);
    window.onload = fetchOrders;
  </script>
</body>
</html>
