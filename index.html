<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オーダー呼出システム</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .column {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .column h2 {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 3px solid #eee;
      margin-top: 0;
    }
    .preparing-title { color: #e67e22; border-bottom-color: #e67e22 !important; }
    .ready-title { color: #27ae60; border-bottom-color: #27ae60 !important; }
    
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .receipt-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .items-list {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 15px;
      text-align: left;
      background: #fff;
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed #ccc;
      min-height: 40px;
    }
    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
      color: #fff;
      width: 100%;
    }
    .btn:active { opacity: 0.7; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }
    
    .btn-ready { background-color: #e67e22; }
    .btn-done { background-color: #27ae60; }
  </style>
</head>
<body>

  <h1>オーダー状況</h1>
  
  <div class="container">
    <div class="column">
      <h2 class="preparing-title">調理中</h2>
      <div id="preparing-container" class="orders-grid">
        <!-- 調理中のオーダーがここに入ります -->
      </div>
    </div>
    <div class="column">
      <h2 class="ready-title">呼出中 (お受取口へ)</h2>
      <div id="ready-container" class="orders-grid">
        <!-- 呼出中のオーダーがここに入ります -->
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ★ここを最新のGASウェブアプリURLに書き換えてください★
    // ==========================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwiPE1wSVaTV767nz1r31h3qNUiJWKwn8e53VtK5UH3lIuxm2FH30LyW4sObaFT4oQ0OQ/exec';

    // 画面初期化・定期更新用
    function fetchOrders() {
      const script = document.createElement('script');
      script.src = `${GAS_URL}?callback=renderOrders&t=${new Date().getTime()}`;
      document.body.appendChild(script);
    }

    // ステータスを更新してスプレッドシートへ送信
    function updateStatus(receiptNumber, newStatus, btnElement) {
      // 連打防止のためボタンを無効化
      btnElement.disabled = true;
      btnElement.innerText = "処理中...";

      const url = `${GAS_URL}?action=update_status&receiptNumber=${encodeURIComponent(receiptNumber)}&status=${encodeURIComponent(newStatus)}&callback=updateCallback`;
      const script = document.createElement('script');
      script.src = url;
      document.body.appendChild(script);
      
      // 呼出中に切り替えた場合のみ、音声を再生する
      if(newStatus === '呼出中') {
         playCustomVoice(receiptNumber);
      }
    }

    // GASからの更新完了通知を受け取るコールバック
    function updateCallback(response) {
      fetchOrders(); // 画面を最新状態にリロード
    }

    // 画面にオーダーカードを描画する
    function renderOrders(orders) {
      const preparingContainer = document.getElementById('preparing-container');
      const readyContainer = document.getElementById('ready-container');
      
      preparingContainer.innerHTML = '';
      readyContainer.innerHTML = '';

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // GASから来た改行(\n)をHTMLの<br>に変換
        const itemsHtml = order.items ? order.items.replace(/\n/g, '<br>') : '商品情報なし';

        card.innerHTML = `
          <div class="receipt-number">${order.receiptNumber}</div>
          <div class="items-list">${itemsHtml}</div>
        `;

        if (order.status === '調理中') {
          const btn = document.createElement('button');
          btn.className = 'btn btn-ready';
          btn.innerText = '準備完了';
          btn.onclick = () => updateStatus(order.receiptNumber, '呼出中', btn);
          card.appendChild(btn);
          preparingContainer.appendChild(card);
        } else if (order.status === '呼出中') {
          const btn = document.createElement('button');
          btn.className = 'btn btn-done';
          btn.innerText = '受渡';
          btn.onclick = () => updateStatus(order.receiptNumber, '受渡完了', btn);
          card.appendChild(btn);
          readyContainer.appendChild(card);
        }
      });
    }

    // ==========================================
    // ★自作音声の順番再生ロジック★
    // ==========================================
    async function playCustomVoice(receiptNumber) {
      const playAudio = (fileName) => {
        return new Promise((resolve) => {
          // index.htmlと同じ階層の audio フォルダから読み込む
          const audio = new Audio('./audio/' + fileName);
          audio.onended = resolve;       // 再生が終わったら次へ
          audio.onerror = resolve;       // ファイルが無い等のエラー時も次へスキップ
          audio.play().catch(resolve);   // ブラウザの自動再生ブロック時も止まらず次へ
        });
      };

      try {
        // ① 冒頭：「レシート番号」
        await playAudio('prefix.mp3');

        // ② 番号：「#1-0012」などの記号を消して数字「10012」だけを抽出し、1文字ずつ再生
        const digits = receiptNumber.replace(/\D/g, ''); 
        for (let i = 0; i < digits.length; i++) {
          await playAudio(digits[i] + '.mp3');
        }

        // ③ 末尾：「番のお客様、受渡口まで〜」
        await playAudio('suffix.mp3');
      } catch (e) {
        console.error("音声再生エラー", e);
      }
    }

    // 10秒ごとにGASに最新情報を問い合わせる（自動更新）
    setInterval(fetchOrders, 10000);
    
    // ページを開いた瞬間に1回目の読み込みを実行
    window.onload = fetchOrders;
  </script>
</body>
</html>
