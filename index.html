<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>システムメニュー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #2c3e50;
      margin-top: 40px;
      margin-bottom: 40px;
      font-size: 2.5rem;
      text-align: center;
    }
    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      max-width: 600px;
    }
    .menu-btn {
      display: block;
      background: #fff;
      border: 2px solid #ddd;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s;
    }
    .menu-btn:hover, .menu-btn:active {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      border-color: #3498db;
    }
    .title {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
    }
    .description {
      font-size: 1.1rem;
      color: #7f8c8d;
      display: block;
    }
    .icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1>画面選択メニュー</h1>
  
  <div class="menu-container">
    <a href="kitchen.html" class="menu-btn">
      <span class="icon">🍳</span>
      <span class="title">キッチン専用画面</span>
      <span class="description">【調理メイン】新規オーダーの通知音が鳴ります</span>
    </a>
    
    <a href="counter.html" class="menu-btn">
      <span class="icon">💁‍♀️</span>
      <span class="title">受渡口専用画面</span>
      <span class="description">【受渡メイン】レジ前用のため音は鳴りません</span>
    </a>
    
    <a href="customer.html" class="menu-btn">
      <span class="icon">📺</span>
      <span class="title">お客様お呼出画面</span>
      <span class="description">番号の読み上げ音声と、画面の点滅をします</span>
    </a>
  </div>

</body>
</html>
