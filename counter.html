<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご注文状況 - お客様お呼出画面</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .column {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .column h2 {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 3px solid #eee;
      margin-top: 0;
      font-size: 1.8rem;
    }
    .preparing-title { color: #e67e22; border-bottom-color: #e67e22 !important; }
    .ready-title { color: #27ae60; border-bottom-color: #27ae60 !important; }
    
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .card {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 30px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: fadeIn 0.5s ease-in-out;
      transition: background-color 0.3s, color 0.3s;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .receipt-number {
      font-size: 3.5rem;
      font-weight: bold;
      color: #2c3e50;
      margin: 0;
    }

    .blink {
      animation: flashWarning 1s infinite;
    }
    @keyframes flashWarning {
      0%, 100% { background-color: #fafafa; }
      50% { background-color: #f1c40f; }
    }
    .blink .receipt-number {
      color: #d35400;
    }
  </style>
</head>
<body>

  <h1>ご注文の番号</h1>
  
  <div class="container">
    <div class="column">
      <h2 class="preparing-title">調理中</h2>
      <div id="preparing-container" class="orders-grid"></div>
    </div>
    <div class="column">
      <h2 class="ready-title">お受取口へお越しください</h2>
      <div id="ready-container" class="orders-grid"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://order-system-6a1e2-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ordersRef = db.ref('orders');

    let isInitialLoad = true; 
    let knownStatuses = {}; 

    // ==========================================
    // ★音声の「おまとめ」機能
    // ==========================================
    let audioQueue = [];
    let isPlayingAudio = false;
    let batchTimer = null; // まとめるための待機タイマー

    function enqueueVoice(receiptNumber) {
      audioQueue.push(receiptNumber);
      
      if (isPlayingAudio) return; // すでに喋っている最中なら列に並べるだけ
      
      // ボタンが押されてから「2秒間」だけ待つ。
      // この2秒間に他のボタンが押されたら、一緒にまとめてアナウンスする
      if (batchTimer) clearTimeout(batchTimer);
      batchTimer = setTimeout(() => {
        processAudioQueue();
      }, 2000);
    }

    async function processAudioQueue() {
      if (audioQueue.length === 0) {
        isPlayingAudio = false;
        return;
      }
      
      isPlayingAudio = true;
      
      // キューに溜まっている番号をごっそり取り出す
      const batch = [...audioQueue];
      audioQueue = []; 
      
      await playCustomVoiceBatch(batch);
      
      // 読み上げ完了後、さらに溜まっていたら再実行
      setTimeout(processAudioQueue, 1000);
    }

    async function playCustomVoiceBatch(receiptNumbers) {
      const playAudio = (fileName) => {
        return new Promise((resolve) => {
          const audio = new Audio('./audio/' + fileName);
          audio.onended = resolve;
          audio.onerror = resolve; // ファイルが無い場合も止まらずに次へ進む
          audio.play().catch(resolve);
        });
      };

      try {
        await playAudio('prefix.mp3'); // 「レシート番号」
        
        for (let j = 0; j < receiptNumbers.length; j++) {
          const recNum = receiptNumbers[j];
          
          for (let i = 0; i < recNum.length; i++) {
            const char = recNum[i];
            if (/[0-9]/.test(char)) await playAudio(char + '.mp3');
            else if (char === '-') await playAudio('hyphen.mp3');
          }
          
          // ==========================================
          // もし「nn番、mm番」と読ませるために「ban.mp3（番）」を
          // audioフォルダに追加した場合は、以下の「//」を消してください。
          //
           await playAudio('ban.mp3');
          // ==========================================
          
          // 複数の番号を呼ぶ際、番号と番号の間に少し間（0.8秒）を空ける
          if (j < receiptNumbers.length - 1) {
            await new Promise(resolve => setTimeout(resolve, 800));
          }
        }
        
        await playAudio('suffix.mp3'); // 「お受取口へお越しください」
      } catch (e) {
        console.error("音声再生エラー", e);
      }
    }

    // Firebaseデータ受信処理
    ordersRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const orders = [];
      for (let key in data) orders.push(data[key]);
      orders.sort((a, b) => a.timestamp - b.timestamp);
      renderOrders(orders);
    });

    function renderOrders(orders) {
      const preparingContainer = document.getElementById('preparing-container');
      const readyContainer = document.getElementById('ready-container');
      
      let hasNewOrder = false;
      const serverReceipts = orders.map(o => o.receiptNumber);

      document.querySelectorAll('.card').forEach(card => {
        const rec = card.dataset.receipt;
        if (!serverReceipts.includes(rec)) {
          card.remove();
          delete knownStatuses[rec];
        }
      });

      orders.forEach(order => {
        let card = document.querySelector(`.card[data-receipt="${order.receiptNumber}"]`);
        const prevStatus = knownStatuses[order.receiptNumber];

        if (!isInitialLoad && !prevStatus && order.status === '調理中') hasNewOrder = true;

        if (!card) {
          card = document.createElement('div');
          card.className = 'card';
          card.dataset.receipt = order.receiptNumber;
          card.innerHTML = `<div class="receipt-number">${order.receiptNumber}</div>`;
        }

        // 呼出中になった瞬間の処理（音声キュー追加＋点滅）
        if (!isInitialLoad && order.status === '呼出中' && prevStatus !== '呼出中') {
           enqueueVoice(order.receiptNumber);
           card.classList.add('blink');
           setTimeout(() => { if (card) card.classList.remove('blink'); }, 15000);
        }
        
        knownStatuses[order.receiptNumber] = order.status;

        if (order.status === '調理中' && card.parentElement !== preparingContainer) {
          preparingContainer.appendChild(card);
        } else if (order.status === '呼出中' && card.parentElement !== readyContainer) {
          readyContainer.appendChild(card);
        }
      });

      if (hasNewOrder) {
        new Audio('./audio/notify.mp3').play().catch(e => console.error("通知音再生エラー", e));
      }
      setTimeout(() => { isInitialLoad = false; }, 1000); 
    }
  </script>
</body>
</html>
